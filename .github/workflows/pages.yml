name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Expand training page to plain HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          p = Path('xingyu-hr-training/index.html')
          s = p.read_text('utf-8')
          m = re.search(r"const b='([^']+)'", s)
          if not m:
              print('No compressed wrapper detected; keeping current HTML.')
          else:
              payload = m.group(1)
              payload += '=' * (-len(payload) % 4)
              html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
              p.write_text(html, encoding='utf-8')
              print(f'Expanded plain HTML: {len(html)} chars')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published training page
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://engty.github.io/Public/xingyu-hr-training/"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL" || true)
            echo "attempt=$i http_status=$CODE"
            if [ "$CODE" = "200" ]; then
              grep -o '<title>[^<]*</title>' /tmp/page.html | head -1 || true
              if grep -q 'DecompressionStream' /tmp/page.html; then
                echo 'ERROR: compressed browser wrapper is still deployed'
                exit 1
              fi
              if grep -q '从“校招解约”到治理危机' /tmp/page.html; then
                echo 'Verified: plain training HTML is live'
                exit 0
              fi
              echo 'HTTP 200 but expected training content not found'
            fi
            sleep 5
          done
          exit 1
