name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published training page
        shell: bash
        run: |
          set -euxo pipefail
          URL="https://engty.github.io/Public/xingyu-hr-training/"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -L -sS -o /tmp/page.html -w "%{http_code}" "$URL" || true)
            echo "attempt=$i http_status=$CODE"
            if [ "$CODE" = "200" ]; then
              grep -o '<title>[^<]*</title>' /tmp/page.html | head -1 || true
              head -c 200 /tmp/page.html || true
              exit 0
            fi
            sleep 5
          done
          echo "Published page did not return HTTP 200"
          exit 1
